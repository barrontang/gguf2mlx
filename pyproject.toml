[project]
name = "gguf2mlx"
version = "2.1.0"
description = "Convert verified GGUF models to MLX-LM safetensors on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "gguf",
    "mlx",
    "mlx-lm",
    "apple-silicon",
    "safetensors",
    "llama.cpp",
    "model-conversion",
]
authors = [
    {name = "Barron Tang", email = "barrontom2011@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gguf>=0.18.0",
    "safetensors",
    "numpy",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/barrontang/gguf2mlx"
Repository = "https://github.com/barrontang/gguf2mlx"
Issues = "https://github.com/barrontang/gguf2mlx/issues"

[project.optional-dependencies]
mlx = ["mlx>=0.18.0", "mlx-lm>=0.29.0"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "tokenizers>=0.20"]

[project.scripts]
gguf2mlx = "gguf2mlx:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
gguf2mlx = ["data/*.jinja"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
