name: Convert GGUF and publish MLX

# Thin shell around `gguf2mlx publish`. The pipeline itself lives in
# src/gguf2mlx/publish.py so it can be unit-tested without a runner, a token,
# or a real repository. Nothing from the inputs is ever interpolated into a
# script body: every value reaches the shell through the environment.
#
# Float16 conversion needs only numpy/gguf/safetensors, so the default path
# runs on ubuntu-latest. Quantization needs MLX, so `quantize: true` keeps a
# macOS Apple Silicon runner.

on:
  workflow_call:
    inputs:
      source_repo:
        description: Hugging Face model repository containing the GGUF and README.md
        required: true
        type: string
      gguf_file:
        description: GGUF filename (any shard of a split set; all shards are merged)
        required: true
        type: string
      source_revision:
        description: Uploaded GGUF commit SHA, tag, or branch (resolved to a commit)
        default: main
        type: string
      destination_repo:
        description: Hugging Face model repository to create or update
        required: true
        type: string
      private:
        description: Create new destination repositories as private
        default: true
        type: boolean
      quantize:
        description: Opt in to lossy affine 4-bit direct quantization instead of FP16
        default: false
        type: boolean
      runner:
        description: macOS Apple Silicon runner used only when quantize is true
        default: macos-15
        type: string
      converter_version:
        description: Published gguf2mlx version to install (needs the publish subcommand)
        default: "2.2.0"
        type: string
    secrets:
      HF_TOKEN:
        description: HF token with source read and destination write permissions
        required: true

permissions:
  contents: read

concurrency:
  group: publish-mlx-${{ inputs.destination_repo }}
  cancel-in-progress: false

jobs:
  convert-publish:
    # MLX only ships Apple Silicon wheels, so quantization pins a macOS runner.
    runs-on: ${{ inputs.quantize && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Require Apple Silicon for quantization
        if: inputs.quantize
        shell: bash
        run: |
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 || {
            echo "Choose a macOS ARM64 runner when quantize is true."
            exit 1
          }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install converter and Hugging Face client
        shell: bash
        env:
          CONVERTER_VERSION: ${{ inputs.converter_version }}
        run: python -m pip install "gguf2mlx[vlm]==${CONVERTER_VERSION}"
      - name: Download, convert, and publish
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          SOURCE_REPO: ${{ inputs.source_repo }}
          GGUF_FILE: ${{ inputs.gguf_file }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          DESTINATION_REPO: ${{ inputs.destination_repo }}
          PRIVATE: ${{ inputs.private }}
          QUANTIZE: ${{ inputs.quantize }}
        run: |
          set -euo pipefail
          # Both values are booleans rendered by GitHub, never caller text.
          extra=""
          if [ "$PRIVATE" = "true" ]; then extra="$extra --private"; else extra="$extra --no-private"; fi
          if [ "$QUANTIZE" = "true" ]; then extra="$extra --quantize"; fi
          # shellcheck disable=SC2086 # intentional word splitting of literal flags
          gguf2mlx publish \
            --source "$SOURCE_REPO" \
            --gguf "$GGUF_FILE" \
            --dest "$DESTINATION_REPO" \
            --source-revision "$SOURCE_REVISION" \
            --work-dir "$RUNNER_TEMP/mlx-publish" \
            $extra
