name: Weekly MoE validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moe-e2e:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GGUF2MLX_RUN_E2E: "1"
      GGUF2MLX_MOE_MODELS: ${{ vars.GGUF2MLX_MOE_MODELS }}
      GGUF2MLX_ROUTER_LOGITS_DIR: ${{ vars.GGUF2MLX_ROUTER_LOGITS_DIR }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mlx]"
      - name: Run two-family MoE validation
        run: >-
          pytest tests/test_e2e.py
          -k real_moe_model_has_finite_logits_routing_entropy_and_coherent_output
          -rx
