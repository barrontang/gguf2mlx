name: Weekly MoE validation

# The MoE fixtures are 11-20 GB, so this job cannot download them on a hosted
# runner. It expects a runner that already holds them and a repository variable
# naming their paths. Until that variable exists the gate is *inactive*, and an
# inactive gate must read as "skipped", not as a weekly red that teaches people
# to ignore failures. A companion job says so out loud.
#
# Setting GGUF2MLX_MOE_MODELS to a JSON object re-arms the strict path below:
# a key that is set but unusable still fails the run.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice-when-unconfigured:
    if: vars.GGUF2MLX_MOE_MODELS == ''
    runs-on: ubuntu-latest
    steps:
      - name: Say that the weekly MoE gate is not armed
        run: |
          echo "::warning title=Weekly MoE gate inactive::GGUF2MLX_MOE_MODELS is unset, so this gate validated nothing. Set the repository variable to a JSON object mapping qwen3moe/deepseek2 to local GGUF paths on a runner that holds them."

  moe-e2e:
    if: vars.GGUF2MLX_MOE_MODELS != ''
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GGUF2MLX_RUN_E2E: "1"
      GGUF2MLX_MOE_MODELS: ${{ vars.GGUF2MLX_MOE_MODELS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mlx]"
      - name: Require both configured model fixtures
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Reaching this step means the variable is set, so an empty parse is a
          # configuration error worth failing on rather than skipping past.
          models = json.loads(os.environ.get("GGUF2MLX_MOE_MODELS") or "{}")
          required = {"qwen3moe", "deepseek2"}
          missing = required - models.keys()
          unavailable = [name for name in required if name in models and not Path(models[name]).is_file()]
          if missing or unavailable:
              raise SystemExit(
                  "MoE fixtures missing="
                  f"{sorted(missing)}, unavailable={sorted(unavailable)}. "
                  "Set the GGUF2MLX_MOE_MODELS repository variable to a JSON "
                  'object mapping qwen3moe/deepseek2 to local GGUF paths.'
              )
          PY
      - name: Run two-family MoE validation
        run: >-
          pytest tests/test_e2e.py
          -k real_moe_model_has_finite_logits_routing_entropy_and_coherent_output
          -rx
