name: Weekly MoE validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moe-e2e:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      GGUF2MLX_RUN_E2E: "1"
      GGUF2MLX_MOE_MODELS: ${{ vars.GGUF2MLX_MOE_MODELS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,mlx]"
      - name: Require both configured model fixtures
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # An unset repository variable reaches the job as an empty string,
          # which is not valid JSON. Treat it as "nothing configured" so the
          # failure message names the real problem.
          models = json.loads(os.environ.get("GGUF2MLX_MOE_MODELS") or "{}")
          required = {"qwen3moe", "deepseek2"}
          missing = required - models.keys()
          unavailable = [name for name in required if name in models and not Path(models[name]).is_file()]
          if missing or unavailable:
              raise SystemExit(
                  "MoE fixtures missing="
                  f"{sorted(missing)}, unavailable={sorted(unavailable)}. "
                  "Set the GGUF2MLX_MOE_MODELS repository variable to a JSON "
                  'object mapping qwen3moe/deepseek2 to local GGUF paths.'
              )
          PY
      - name: Run two-family MoE validation
        run: >-
          pytest tests/test_e2e.py
          -k real_moe_model_has_finite_logits_routing_entropy_and_coherent_output
          -rx
