name: Docs

# Builds the MkDocs site in docs/ and publishes it to GitHub Pages.
#
# The repo's Pages source must be "GitHub Actions", not the legacy
# "main branch /docs" setting: the legacy path serves the raw Markdown as-is,
# which is why https://barrontang.github.io/gguf2mlx/ returned 404 — Jekyll had
# no index page to serve. Only the Actions path can run `mkdocs build`.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      # --strict turns link and nav warnings into build failures, matching the
      # "documentation links actually resolve" rule in the changelog.
      - name: Build
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
