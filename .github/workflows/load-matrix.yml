name: Load matrix

# P0-2: turn "declared supported" into "actually loads".
# Nightly runs the cheap half (Q4_K_M, Apple Silicon); the full sweep of every
# pinned qtype is a manual dispatch so it does not burn runner time daily.
#
# One job per (architecture, qtype) on purpose: a converted FP16 model is 3-5x
# the GGUF it came from, and a single macos-14 runner only has ~14 GB free. The
# first full sweep ran all thirteen cases in one job and died of ENOSPC partway
# through, which looked like a conversion bug.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      qtypes:
        description: "Comma-separated quantization types to test"
        required: false
        default: "q4_0,q4_k_m,q8_0"

concurrency:
  group: load-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan entries
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.select.outputs.entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: select
        env:
          QTYPES: ${{ inputs.qtypes || 'q4_k_m' }}
        run: |
          python - <<'PY'
          import json
          import os

          wanted = {q.strip() for q in os.environ["QTYPES"].split(",") if q.strip()}
          entries = json.load(open("tests/load_matrix.json", encoding="utf-8"))
          selected = [e for e in entries if not wanted or e["qtype"] in wanted]
          known = {e["qtype"] for e in entries}
          unknown = wanted - known
          if unknown:
              raise SystemExit(f"unknown qtypes {sorted(unknown)}; known: {sorted(known)}")
          if not selected:
              raise SystemExit("no matrix entries selected")
          ids = [f"{e['arch']}-{e['qtype']}" for e in selected]
          print(f"selected {len(selected)} entries: {ids}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"entries={json.dumps(selected, separators=(',', ':'))}\n")
          PY

  matrix:
    name: ${{ matrix.entry.arch }}-${{ matrix.entry.qtype }}
    needs: plan
    # Apple Silicon is required: mlx_lm cannot even import on Intel.
    runs-on: macos-14
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report free disk
        run: df -h /

      - name: Install package with MLX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mlx,vlm]" pytest

      - name: Require an Apple Silicon runtime
        run: |
          python - <<'PY'
          import platform
          import mlx.core as mx
          import mlx_lm  # noqa: F401

          if platform.machine() != "arm64":
              raise SystemExit(f"mlx_lm needs arm64, got {platform.machine()}")
          print("mlx", mx.__version__ if hasattr(mx, "__version__") else "?")
          print("machine", platform.machine())
          PY

      - name: Run load matrix
        env:
          GGUF2MLX_LOAD_MATRIX: "1"
          GGUF2MLX_LOAD_MATRIX_ENTRY: ${{ matrix.entry.arch }}-${{ matrix.entry.qtype }}
        # --basetemp stays inside the workspace so the report copy made by the
        # test is actually visible to upload-artifact (the default pytest
        # basetemp lives in /private/var/folders and is not searched).
        run: pytest tests/test_load_matrix.py -q -ra --basetemp=load-matrix-tmp

      - name: Upload conversion report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: load-matrix-${{ matrix.entry.arch }}-${{ matrix.entry.qtype }}
          path: |
            **/conversion_report.json
          if-no-files-found: ignore
          retention-days: 14
